services:
  web:
    build:
      target: dev
    # Ensure the Prisma client exists inside the node_modules volume.
    command: sh -c "npx prisma generate && npm run dev"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    environment:
      - APP_URL=http://localhost:3000

  # Dev mail sink: catches all outbound email. UI at http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  # sadmo_node_modules — the container's Linux-native node_modules, kept separate
  # from the host `.:/app` bind mount (host installs are macOS binaries).
  node_modules:
  # sadmo_next_cache — the .next build cache, persisted so dev restarts stay fast.
  next_cache:
